<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARC·OPS — 6-DoF Arm Fleet Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #06090d;
    --bg-1:      #0a0e14;
    --bg-2:      #0d1219;
    --panel:     #0c1117;
    --panel-2:   #0f151d;
    --border:    rgba(140,180,200,.12);
    --border-2:  rgba(140,180,200,.20);
    --track:     rgba(140,180,200,.10);
    --fg:        #d6e0e8;
    --fg-mute:   #8c9ba8;
    --dim:       #56646f;
    --off:       #3a444e;
    --ok:        #4ade80;
    --info:      #38bdf8;
    --warn:      #fbbf24;
    --err:       #ef4444;
    --magenta:   #e879f9;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter Tight", system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .dim  { color: var(--dim) !important; }
  .tag  { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .08em; color: var(--fg-mute); text-transform: uppercase; }
  hr.hr { border: 0; border-top: 1px dashed var(--border); margin: 10px 0; }

  .app {
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: 52px 1fr 32px;
    grid-template-areas: "top top" "nav main" "bot bot";
    height: 100vh;
    background:
      radial-gradient(ellipse at top right, rgba(56,189,248,.05), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(74,222,128,.03), transparent 50%),
      var(--bg);
  }

  /* topbar */
  .topbar { grid-area: top; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); background: var(--bg-1); gap: 24px; }
  .topbar-l, .topbar-r { display: flex; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--fg-mute); }
  .breadcrumb .dim { color: var(--dim); }
  .topbar-counts { display: flex; gap: 1px; background: var(--border); padding: 1px; border: 1px solid var(--border); }
  .topbar-count { background: var(--bg-2); padding: 4px 10px; display: flex; flex-direction: column; align-items: center; min-width: 44px; }
  .topbar-count .mono { line-height: 1.1; }
  .alert-pill { display: flex; align-items: center; gap: 6px; background: rgba(239,68,68,.08); color: var(--err);
    border: 1px solid rgba(239,68,68,.4); padding: 4px 10px; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer; }
  .alert-pill:hover { background: rgba(239,68,68,.16); }
  .clock { text-align: right; line-height: 1.2; }
  .user { display: flex; align-items: center; gap: 8px; padding-left: 12px; border-left: 1px solid var(--border); }

  /* sidenav */
  .sidenav { grid-area: nav; display: flex; flex-direction: column; gap: 1px; background: var(--bg-1);
    border-right: 1px solid var(--border); padding: 8px 0; }
  .navbtn { position: relative; background: transparent; border: 0; color: var(--dim);
    padding: 12px 4px 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; font-family: inherit; border-left: 2px solid transparent; }
  .navbtn-icon { font-size: 18px; line-height: 1; color: var(--fg-mute); }
  .navbtn-label { font-family: "JetBrains Mono", monospace; font-size: 8.5px; letter-spacing: .08em; color: var(--dim); }
  .navbtn-hot { position: absolute; top: 4px; right: 4px; font-family: "JetBrains Mono", monospace; font-size: 8px; color: var(--dim); }
  .navbtn:hover { color: var(--fg); background: rgba(255,255,255,.02); }
  .navbtn:hover .navbtn-icon, .navbtn:hover .navbtn-label { color: var(--fg); }
  .navbtn.active { background: rgba(74,222,128,.06); border-left-color: var(--ok); }
  .navbtn.active .navbtn-icon, .navbtn.active .navbtn-label { color: var(--ok); }
  .navfoot { padding: 8px 6px; border-top: 1px solid var(--border); text-align: center; }

  /* main */
  .main { grid-area: main; overflow: hidden; position: relative; }

  /* bottom */
  .bottombar { grid-area: bot; display: flex; align-items: center; gap: 0; padding: 0 12px;
    border-top: 1px solid var(--border); background: var(--bg-1); }
  .bb-item { display: flex; gap: 6px; align-items: baseline; padding: 6px 14px 0; border-right: 1px solid var(--border); height: 100%; }
  .bb-item:first-child { padding-left: 0; }

  /* panel */
  .panel { background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
    border-bottom: 1px solid var(--border); background: var(--bg-1); flex-shrink: 0; gap: 10px; }
  .panel-title { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em; color: var(--ok); text-transform: uppercase; }
  .panel-body { padding: 10px; overflow: auto; flex: 1; min-height: 0; }

  /* screens */
  .screen { height: 100%; padding: 10px; gap: 10px; overflow: hidden; min-height: 0; }
  .screen.tasks, .screen.scene-arm, .screen.teleop-arm, .screen.analytics, .screen.settings, .screen.path, .screen.import, .screen.cam { height: auto; overflow: auto; }
  .screen.empty { display: grid; place-items: center; }

  .fleet { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; gap: 10px; }
  .fleet .screen-l { display: grid; grid-template-rows: 1fr 280px; gap: 10px; min-height: 0; min-width: 0; }
  .fleet .screen-r { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; }
  .fleet .screen-l > .panel { min-height: 0; }

  /* factory cell map */
  .factorymap { position: relative; width: 100%; height: 100%; background:
    radial-gradient(ellipse at center, var(--bg-2), var(--bg)); overflow: hidden; }
  .floormap-grid { position: absolute; inset: 0; width: 100%; height: 100%; }
  .floor-hud { position: absolute; background: rgba(6,9,13,.7); border: 1px solid var(--border);
    padding: 8px 10px; backdrop-filter: blur(8px); display: flex; gap: 10px; align-items: center; z-index: 5; }
  .floor-hud.tl { top: 10px; left: 10px; }
  .floor-hud.tr { top: 10px; right: 10px; }
  .floor-hud.bl { bottom: 10px; left: 10px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .floor-hud.br { bottom: 10px; right: 10px; flex-direction: column; align-items: flex-end; gap: 2px; }

  .cells { position: absolute; inset: 46px 40px 46px 40px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    grid-auto-rows: minmax(74px, 1fr); gap: 6px; z-index: 2;
    overflow: auto;
  }
  .cell { position: relative; background: var(--bg-2); border: 1px solid var(--border-2);
    padding: 5px 7px; display: flex; flex-direction: column; gap: 3px;
    cursor: pointer; text-align: left; color: var(--fg); font: inherit; transition: background .12s;
    --sc: var(--fg-mute); overflow: hidden; min-width: 0;
  }
  .cell:hover { background: rgba(255,255,255,.025); border-color: var(--sc); }
  .cell.sel { border-color: var(--sc); background: color-mix(in srgb, var(--sc) 8%, var(--bg-2)); box-shadow: inset 0 0 0 1px var(--sc); }
  .cell.st-ACTIVE { border-left: 2px solid var(--ok); }
  .cell.st-IDLE   { border-left: 2px solid var(--fg-mute); }
  .cell.st-TELEOP { border-left: 2px solid var(--magenta); }
  .cell.st-FAULT  { border-left: 2px solid var(--err); }
  .cell.st-OFFLINE{ border-left: 2px solid var(--off); }
  .cell-hd { display: flex; justify-content: space-between; align-items: center; }
  .cell-id { font-size: 10px; color: var(--fg); font-weight: 500; }
  .cell-body { display: flex; align-items: center; gap: 6px; }
  .cell-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .cell-task { font-size: 9px; color: var(--fg-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px dashed var(--border); padding-top: 3px; }
  .cell-foot { display: flex; justify-content: space-between; font-size: 8px; }
  .cell-pulse { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: var(--ok); border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(74,222,128,.3); animation: cellpulse 2s ease-in-out infinite; }
  @keyframes cellpulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(0.85); } }

  /* table */
  .table-wrap { overflow: auto; height: 100%; }
  .table-wrap.small { font-size: 10.5px; }
  .dtable { width: 100%; border-collapse: collapse; font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .dtable th { text-align: left; font-weight: 500; color: var(--dim); text-transform: uppercase;
    letter-spacing: .08em; font-size: 9.5px; padding: 6px 8px; position: sticky; top: 0;
    background: var(--bg-1); border-bottom: 1px solid var(--border-2); cursor: pointer; user-select: none; }
  .dtable th:hover { color: var(--fg); }
  .dtable td { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--fg); }
  .dtable tr { cursor: pointer; }
  .dtable tr:hover { background: rgba(255,255,255,.02); }
  .dtable tr.sel { background: rgba(74,222,128,.07); }
  .dtable tr.sel td { color: var(--ok); }
  .dtable tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--ok); }
  .dtable tr.row-err { background: rgba(239,68,68,.04); }

  /* chips / buttons / inputs */
  .chip { background: transparent; color: var(--fg-mute); border: 1px solid var(--border-2);
    padding: 3px 8px; font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .06em; cursor: pointer; }
  .chip:hover { color: var(--fg); border-color: var(--fg-mute); }
  .chip.on { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.06); }
  .btn { background: transparent; color: var(--fg); border: 1px solid var(--border-2);
    padding: 5px 10px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .06em; cursor: pointer; }
  .btn:hover { border-color: var(--fg-mute); background: rgba(255,255,255,.02); }
  .btn.primary { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.08); }
  .btn.primary:hover { background: rgba(74,222,128,.16); }
  .btn.danger { color: var(--err); border-color: var(--err); background: rgba(239,68,68,.08); }
  .btn.danger:hover { background: rgba(239,68,68,.18); }
  .inp { background: var(--bg-2); border: 1px solid var(--border); color: var(--fg);
    padding: 4px 8px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; }
  .inp:focus { outline: none; border-color: var(--ok); }
  .slider { width: 100%; accent-color: var(--ok); }

  /* alerts list */
  .alerts { display: flex; flex-direction: column; max-height: 100%; overflow: auto; }
  .alert { display: grid; grid-template-columns: 40px 70px 70px 1fr; gap: 8px; align-items: center;
    padding: 5px 10px; border-bottom: 1px solid var(--border); }
  .alert:hover { background: rgba(255,255,255,.02); }
  .sev { font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 1px 4px; letter-spacing: .08em;
    border: 1px solid; text-align: center; min-width: 38px; display: inline-block; }
  .sev-OK    { color: var(--ok);     border-color: var(--ok);     background: rgba(74,222,128,.08); }
  .sev-INFO  { color: var(--info);   border-color: var(--info);   background: rgba(56,189,248,.08); }
  .sev-WARN  { color: var(--warn);   border-color: var(--warn);   background: rgba(251,191,36,.08); }
  .sev-ERR   { color: var(--err);    border-color: var(--err);    background: rgba(239,68,68,.08); }
  .sev-DEBUG { color: var(--fg-mute);border-color: var(--border-2);background: transparent; }

  /* robot detail grid */
  .robot { padding: 10px; }
  .robot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 280px 280px auto; gap: 10px; height: calc(100vh - 84px - 32px); overflow: auto; }
  .robot-grid > .panel { min-height: 0; }
  .tcp-pose { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 14px; font-size: 11px; margin-top: 4px; }
  .tcp-pose > div { display: flex; gap: 6px; align-items: baseline; }
  .iogrid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
  .iobit { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg-2); color: var(--dim); font-size: 8px; }
  .iobit.on { background: rgba(74,222,128,.16); border-color: var(--ok); color: var(--ok); }
  .iobit.out.on { background: rgba(56,189,248,.16); border-color: var(--info); color: var(--info); }

  /* camera */
  .camera { position: relative; background: #02060a; border: 1px solid var(--border); overflow: hidden; width: 100%; height: 100%; }
  .cam-hud-tl, .cam-hud-tr, .cam-hud-bl, .cam-hud-br {
    position: absolute; font-family: "JetBrains Mono", monospace; font-size: 10px; padding: 4px 8px; z-index: 2;
    background: rgba(6,9,13,.55); backdrop-filter: blur(2px);
  }
  .cam-hud-tl { top: 8px; left: 8px; }
  .cam-hud-tr { top: 8px; right: 8px; }
  .cam-hud-bl { bottom: 8px; left: 8px; }
  .cam-hud-br { bottom: 8px; right: 8px; }

  /* teleop arm */
  .teleop-arm { padding: 10px; overflow: auto; }
  .teleop-arm-grid { display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: minmax(340px, 1.3fr) minmax(240px, 1fr);
    gap: 10px; min-height: calc(100vh - 84px - 32px); }
  .teleop-arm-grid > .panel { min-height: 0; overflow: hidden; }
  .teleop-3d { position: relative; width: 100%; height: 100%; background: #02060a; min-height: 340px; }
  .teleop-3d > div:first-child { width: 100% !important; height: 100% !important; }

  .jogpad { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  .jogrow { display: flex; align-items: center; gap: 4px; }
  .jogbtn { background: var(--bg-2); border: 1px solid var(--border-2); color: var(--ok);
    padding: 6px 12px; font-family: "JetBrains Mono", monospace; font-size: 11px; cursor: pointer; min-width: 50px; }
  .jogbtn:hover { background: rgba(74,222,128,.1); border-color: var(--ok); }
  .jogbtn:active { background: rgba(74,222,128,.2); }
  .jogbtn.small { padding: 2px 6px; min-width: 26px; font-size: 10px; }
  .jjog { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); }

  /* scene 3D */
  .scene-arm { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr;
    grid-template-rows: minmax(420px, 2fr) minmax(240px, 1fr);
    gap: 10px; min-height: calc(100vh - 84px - 32px);
    padding: 10px; overflow: auto; }
  .scene-arm > .panel { min-height: 0; }
  .scene-3d { position: relative; width: 100%; height: 100%; background: #02060a; overflow: hidden; min-height: 380px; }
  .scene-3d > div:first-child { width: 100% !important; height: 100% !important; }
  .dhtable { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .dhtable th, .dhtable td { text-align: left; padding: 3px 6px; font-family: "JetBrains Mono", monospace; font-size: 10px; border-bottom: 1px solid var(--border); }
  .dhtable th { color: var(--dim); }

  /* tasks */
  .tasks { padding: 10px; overflow: auto; }
  .tasks-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: minmax(260px, 1.4fr) minmax(180px, auto) minmax(260px, auto);
    gap: 10px; min-height: calc(100vh - 84px - 32px); }
  .tasks-grid > .panel { min-height: 0; }
  .gantt { position: relative; padding: 10px; }
  .gantt-axis { display: flex; padding-left: 110px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
  .gantt-tick { flex: 1; border-left: 1px dashed var(--border); padding-left: 4px; }
  .gantt-row { display: flex; height: 22px; align-items: center; margin-bottom: 4px; }
  .gantt-label { width: 110px; font-size: 10px; color: var(--fg-mute); }
  .gantt-track { flex: 1; height: 100%; background: var(--track); position: relative; }
  .gantt-bar { position: absolute; top: 2px; bottom: 2px; min-width: 30px; display: flex; align-items: center; color: #06090d; font-weight: 600; }
  .gantt-now { position: absolute; top: 24px; bottom: 10px; width: 2px; background: var(--err); margin-left: 110px; }
  .gantt-now span { position: absolute; top: -16px; left: -14px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .form-row .inp { width: 100%; }
  .avail-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .avail-row:hover { background: rgba(255,255,255,.02); }

  /* analytics */
  .analytics { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; padding: 10px; overflow: auto; min-height: calc(100vh - 84px - 32px); height: auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 10px; }
  .hbars { display: flex; flex-direction: column; gap: 5px; }
  .hbar-row { display: flex; align-items: center; gap: 8px; }
  .heatmap { display: grid; gap: 4px; }
  .heatmap-6 { grid-template-columns: repeat(6, 1fr); }
  .heat-cell { aspect-ratio: 2/1; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; border: 1px solid var(--border); min-height: 50px; }

  /* logs */
  .logs { display: grid; grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100vh - 84px - 32px); }
  .logs > .panel { min-height: 0; }
  .logs > .panel:first-child { grid-row: 1 / span 2; }
  .logstream { font-family: "JetBrains Mono", monospace; padding: 4px 0; overflow: auto; height: 100%; }
  .logline { display: flex; gap: 10px; padding: 2px 10px; border-bottom: 1px solid rgba(140,180,200,.05); align-items: center; }
  .logline:hover { background: rgba(74,222,128,.04); }
  .topic-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .diag-tree { font-family: "JetBrains Mono", monospace; }
  .diag-row { display: flex; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); }

  /* settings */
  .settings { padding: 10px; min-height: calc(100vh - 84px - 32px); height: auto; overflow: auto; }
  .settings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .settings-grid > .panel { min-height: 0; }
  .pid-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .switch { width: 28px; height: 14px; background: var(--track); border: 1px solid var(--border-2); position: relative; cursor: pointer; }
  .switch-thumb { position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; background: var(--fg-mute); transition: .15s; }
  .switch.on { background: rgba(74,222,128,.2); border-color: var(--ok); }
  .switch.on .switch-thumb { left: 15px; background: var(--ok); }

  /* misc */
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  .row input { accent-color: var(--ok); }
  .det { display: grid; grid-template-columns: 12px 70px 50px 1fr; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .det .dot { width: 8px; height: 8px; border-radius: 50%; }
  .check-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--border); }

  /* ───── CAM screen ───── */
  .cam { padding: 10px; overflow: auto; height: auto; min-height: calc(100vh - 84px - 32px); }
  .cam-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 320px;
    grid-template-rows: minmax(380px, 1.3fr) minmax(220px, auto);
    gap: 10px;
    min-height: calc(100vh - 84px - 32px);
  }
  .cam-grid > .panel { min-height: 0; overflow: hidden; }
  .cam-3d { position: relative; width: 100%; height: 100%; background: #02060a; min-height: 380px; }
  .cam-3d > div:first-child { width: 100% !important; height: 100% !important; }

  .cam-hud { position: absolute; left: 12px; bottom: 12px; right: 12px;
    background: rgba(6,9,13,.78); border: 1px solid var(--border-2);
    padding: 6px 10px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
  .cam-hud-row { display: flex; gap: 10px; align-items: center; }

  .cam-slider { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .cam-slider-h { display: flex; justify-content: space-between; align-items: baseline; }

  .picklist { display: flex; flex-direction: column; max-height: 100%; overflow: auto; }
  .pickrow { display: grid; grid-template-columns: 30px 1fr 30px; gap: 8px; align-items: center;
    padding: 5px 10px; border-bottom: 1px solid var(--border); }
  .pickrow:hover { background: rgba(255,255,255,.02); }
  .pickrow-n { font-size: 11px; color: var(--magenta); }
  .pickrow-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .danger-chip { color: var(--err); border-color: rgba(239,68,68,.4); }
  .danger-chip:hover { background: rgba(239,68,68,.12); color: var(--err); }

  .auto-seq { display: flex; flex-direction: column; gap: 1px; max-height: 200px; overflow: auto; margin-top: 6px; }
  .auto-wp { display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    background: rgba(74,222,128,.04); border-left: 2px solid var(--ok); }
  .path { padding: 10px; overflow: auto; height: auto; min-height: calc(100vh - 84px - 32px); }
  .path-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 320px;
    grid-template-rows: minmax(420px, 1.5fr) minmax(180px, auto) minmax(260px, auto);
    gap: 10px;
    min-height: calc(100vh - 84px - 32px);
  }
  .path-grid > .panel { min-height: 0; overflow: hidden; }
  .path-3d { position: relative; width: 100%; height: 100%; background: #02060a; min-height: 380px; }
  .path-3d > div:first-child { width: 100% !important; height: 100% !important; }
  .play-bar {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(6,9,13,.78); border: 1px solid var(--border-2);
    padding: 6px 10px; backdrop-filter: blur(6px);
  }
  .play-btn { background: rgba(74,222,128,.12); color: var(--ok); border: 1px solid var(--ok);
    width: 32px; height: 28px; font-family: "JetBrains Mono", monospace; font-size: 12px; cursor: pointer; }
  .play-btn:hover { background: rgba(74,222,128,.25); }
  .play-btn.small { width: 26px; height: 26px; font-size: 10px; }
  .play-time { color: var(--fg); font-size: 11px; min-width: 110px; }
  .play-scrub { flex: 1; accent-color: var(--ok); }

  .wplist { display: flex; flex-direction: column; max-height: 100%; overflow: auto; }
  .wprow { display: grid; grid-template-columns: 64px 1fr 56px; gap: 6px; padding: 6px 8px;
    background: transparent; border: 0; border-bottom: 1px solid var(--border); border-left: 2px solid transparent;
    cursor: pointer; color: var(--fg); font: inherit; text-align: left; }
  .wprow:hover { background: rgba(255,255,255,.02); }
  .wprow.sel { background: rgba(74,222,128,.08); border-left-color: var(--ok); }
  .wprow.cur { background: rgba(232,121,249,.10); border-left-color: var(--magenta); }
  .wprow-num { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .wprow-num .mono { font-size: 11px; color: var(--ok); }
  .wp-type { font-family: "JetBrains Mono", monospace; font-size: 8.5px; padding: 1px 4px; border: 1px solid; letter-spacing: .04em; }
  .wp-type.lin { color: var(--info); border-color: var(--info); }
  .wp-type.joint { color: var(--warn); border-color: var(--warn); }
  .wprow-name { font-size: 11px; color: var(--fg); font-weight: 500; }
  .wprow-meta { display: flex; gap: 8px; font-size: 9.5px; color: var(--fg-mute); margin-top: 1px; }
  .wprow-io { font-size: 9px; margin-top: 2px; }
  .wprow-t { text-align: right; font-size: 10px; color: var(--ok); align-self: center; }

  .wp-edit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .wp-edit-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .wp-tcp, .wp-joints { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .wp-tcp-row, .wp-joint-row { display: flex; align-items: center; gap: 6px; }
  .wp-tcp-row .inp, .wp-joint-row .inp { flex: 1; min-width: 0; width: 100%; }
  .iotrig { display: flex; align-items: center; gap: 8px; padding: 6px;
    background: rgba(232,121,249,.06); border: 1px solid rgba(232,121,249,.3); margin-top: 4px; }

  /* ───── IMPORT screen ───── */
  .import { padding: 10px; overflow: auto; height: auto; min-height: calc(100vh - 84px - 32px); }
  .import-grid {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: minmax(280px, 1fr) minmax(220px, auto) minmax(180px, auto);
    gap: 10px;
    min-height: calc(100vh - 84px - 32px);
  }
  .import-grid > .panel { min-height: 0; overflow: hidden; }

  .ftree { padding: 6px 0; overflow: auto; height: 100%; }
  .ftree-grp { margin-bottom: 6px; }
  .ftree-dir { display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: rgba(74,222,128,.05); border-bottom: 1px solid var(--border); }
  .ftree-file { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 26px;
    background: transparent; border: 0; cursor: pointer; color: var(--fg); font: inherit; text-align: left;
    width: 100%; border-left: 2px solid transparent; }
  .ftree-file:hover { background: rgba(255,255,255,.025); }
  .ftree-file.sel { background: rgba(74,222,128,.10); border-left-color: var(--ok); }
  .ftree-file.sel .ftree-name { color: var(--ok); }
  .ftree-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ft-type { padding: 1px 4px; border: 1px solid; letter-spacing: .06em; }

  .preview-wrap { width: 100%; height: 100%; overflow: hidden; background: var(--bg-2); }
  .proged-wrap { width: 100%; height: 100%; overflow: auto; padding: 8px 0; }
  .proged { font-family: "JetBrains Mono", monospace; font-size: 10.5px; line-height: 1.6; }
  .proged-line { display: flex; padding: 0 12px; }
  .proged-line:hover { background: rgba(255,255,255,.015); }
  .proged-num { color: var(--dim); width: 36px; flex-shrink: 0; text-align: right; padding-right: 12px; user-select: none; border-right: 1px solid var(--border); }
  .proged-text { padding-left: 12px; white-space: pre; }

  .editor-wrap { width: 100%; height: 100%; min-height: 240px; padding: 0; }
  .editor { width: 100%; height: 100%; background: var(--bg-2); border: 0; color: var(--fg);
    padding: 10px 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.55;
    resize: none; outline: none; tab-size: 4; }

  .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 24px; margin: 10px; border: 2px dashed var(--border-2);
    background: rgba(74,222,128,.02); height: calc(100% - 20px); transition: .15s; }
  .dropzone.on { border-color: var(--ok); background: rgba(74,222,128,.12); }

  .recent { display: flex; flex-direction: column; padding: 4px 0; overflow: auto; }
  .recent-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px;
    background: transparent; border: 0; border-bottom: 1px solid var(--border);
    cursor: pointer; color: var(--fg); font: inherit; text-align: left; }
  .recent-row:hover { background: rgba(255,255,255,.02); }
  .queue-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }

  /* density */
  .app[data-density="dense"] .dtable td { padding: 3px 8px; }
  .app[data-density="dense"] .panel-body { padding: 8px; }
  .app[data-density="comfy"] .panel-body { padding: 14px; }
  .app[data-density="comfy"] .dtable td { padding: 6px 10px; }

  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 4px transparent; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(140,180,200,.15); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(140,180,200,.3); }

  /* film grain scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
    background: repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(255,255,255,.012) 2px, rgba(255,255,255,.012) 3px);
    mix-blend-mode: overlay;
  }
</style>

<!-- Three.js (last version that ships UMD) + minimal inline OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
// Minimal OrbitControls — drag = orbit, wheel = zoom, right-drag = pan.
(function() {
  function OrbitControls(camera, dom) {
    this.object = camera;
    this.domElement = dom;
    this.target = new THREE.Vector3();
    this.enableDamping = false;
    this.dampingFactor = 0.05;
    this.minDistance = 0.1;
    this.maxDistance = 50;
    this.maxPolarAngle = Math.PI;
    this.minPolarAngle = 0;
    this.autoRotate = false;
    this.autoRotateSpeed = 0.5;
    this.zoomSpeed = 1.0;

    const offset = new THREE.Vector3();
    const spherical = new THREE.Spherical();
    const sphericalDelta = new THREE.Spherical();
    let scale = 1;
    const panOffset = new THREE.Vector3();

    let state = "none";
    let pointers = [];
    let startX = 0, startY = 0;

    const self = this;

    function getZoomScale() { return Math.pow(0.95, self.zoomSpeed); }

    function rotateLeft(angle) { sphericalDelta.theta -= angle; }
    function rotateUp(angle) { sphericalDelta.phi -= angle; }

    function panLeft(distance, objectMatrix) {
      const v = new THREE.Vector3();
      v.setFromMatrixColumn(objectMatrix, 0);
      v.multiplyScalar(-distance);
      panOffset.add(v);
    }
    function panUp(distance, objectMatrix) {
      const v = new THREE.Vector3();
      v.setFromMatrixColumn(objectMatrix, 1);
      v.multiplyScalar(distance);
      panOffset.add(v);
    }
    function pan(deltaX, deltaY) {
      const element = self.domElement;
      const position = self.object.position;
      const offset = new THREE.Vector3();
      offset.copy(position).sub(self.target);
      let targetDistance = offset.length();
      targetDistance *= Math.tan((self.object.fov / 2) * Math.PI / 180.0);
      panLeft(2 * deltaX * targetDistance / element.clientHeight, self.object.matrix);
      panUp(2 * deltaY * targetDistance / element.clientHeight, self.object.matrix);
    }

    function onPointerDown(e) {
      if (e.button === 2 || e.button === 1) state = "pan";
      else state = "rotate";
      startX = e.clientX; startY = e.clientY;
      dom.setPointerCapture(e.pointerId);
    }
    function onPointerMove(e) {
      if (state === "none") return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX; startY = e.clientY;
      if (state === "rotate") {
        rotateLeft(2 * Math.PI * dx / dom.clientHeight);
        rotateUp(2 * Math.PI * dy / dom.clientHeight);
      } else if (state === "pan") {
        pan(dx, dy);
      }
    }
    function onPointerUp(e) { state = "none"; }
    function onWheel(e) {
      e.preventDefault();
      if (e.deltaY < 0) scale /= getZoomScale();
      else scale *= getZoomScale();
    }
    function onContextMenu(e) { e.preventDefault(); }

    dom.addEventListener("pointerdown", onPointerDown);
    dom.addEventListener("pointermove", onPointerMove);
    dom.addEventListener("pointerup", onPointerUp);
    dom.addEventListener("pointercancel", onPointerUp);
    dom.addEventListener("wheel", onWheel, { passive: false });
    dom.addEventListener("contextmenu", onContextMenu);

    this.update = function() {
      const position = self.object.position;
      offset.copy(position).sub(self.target);
      spherical.setFromVector3(offset);
      if (self.autoRotate && state === "none") {
        sphericalDelta.theta -= (2 * Math.PI / 60 / 60) * self.autoRotateSpeed * 60;
      }
      spherical.theta += sphericalDelta.theta;
      spherical.phi += sphericalDelta.phi;
      spherical.phi = Math.max(self.minPolarAngle, Math.min(self.maxPolarAngle, spherical.phi));
      spherical.makeSafe();
      spherical.radius *= scale;
      spherical.radius = Math.max(self.minDistance, Math.min(self.maxDistance, spherical.radius));
      self.target.add(panOffset);
      offset.setFromSpherical(spherical);
      position.copy(self.target).add(offset);
      self.object.lookAt(self.target);
      if (self.enableDamping) {
        sphericalDelta.theta *= (1 - self.dampingFactor);
        sphericalDelta.phi *= (1 - self.dampingFactor);
        panOffset.multiplyScalar(1 - self.dampingFactor);
      } else {
        sphericalDelta.set(0, 0, 0);
        panOffset.set(0, 0, 0);
      }
      scale = 1;
    };

    this.dispose = function() {
      dom.removeEventListener("pointerdown", onPointerDown);
      dom.removeEventListener("pointermove", onPointerMove);
      dom.removeEventListener("pointerup", onPointerUp);
      dom.removeEventListener("pointercancel", onPointerUp);
      dom.removeEventListener("wheel", onWheel);
      dom.removeEventListener("contextmenu", onContextMenu);
    };
  }
  THREE.OrbitControls = OrbitControls;
})();
</script>
