<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HELIX·OPS — Humanoid Fleet Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #06090d;
    --bg-1:      #0a0e14;
    --bg-2:      #0d1219;
    --panel:     #0c1117;
    --panel-2:   #0f151d;
    --border:    rgba(140,180,200,.12);
    --border-2:  rgba(140,180,200,.20);
    --track:     rgba(140,180,200,.10);
    --fg:        #d6e0e8;
    --fg-mute:   #8c9ba8;
    --dim:       #56646f;
    --off:       #3a444e;
    --ok:        #4ade80;
    --info:      #38bdf8;
    --warn:      #fbbf24;
    --err:       #ef4444;
    --magenta:   #e879f9;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter Tight", system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .dim  { color: var(--dim) !important; }
  .tag  { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .08em; color: var(--fg-mute); text-transform: uppercase; }
  hr.hr { border: 0; border-top: 1px dashed var(--border); margin: 10px 0; }

  /* page scaffold */
  .app {
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: 52px 1fr 32px;
    grid-template-areas:
      "top top"
      "nav main"
      "bot bot";
    height: 100vh;
    background:
      radial-gradient(ellipse at top right, rgba(56,189,248,.05), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(74,222,128,.03), transparent 50%),
      var(--bg);
  }

  /* topbar */
  .topbar { grid-area: top; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); background: var(--bg-1);
    gap: 24px;
  }
  .topbar-l, .topbar-r { display: flex; align-items: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--fg-mute); }
  .breadcrumb .dim { color: var(--dim); }

  .topbar-counts { display: flex; gap: 1px; background: var(--border); padding: 1px; border: 1px solid var(--border); }
  .topbar-count { background: var(--bg-2); padding: 4px 10px; display: flex; flex-direction: column; align-items: center; min-width: 44px; }
  .topbar-count .mono { line-height: 1.1; }

  .alert-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(239,68,68,.08); color: var(--err);
    border: 1px solid rgba(239,68,68,.4);
    padding: 4px 10px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
    cursor: pointer;
  }
  .alert-pill:hover { background: rgba(239,68,68,.16); }
  .clock { text-align: right; line-height: 1.2; }
  .user { display: flex; align-items: center; gap: 8px; padding-left: 12px; border-left: 1px solid var(--border); }

  /* sidenav */
  .sidenav { grid-area: nav; display: flex; flex-direction: column; gap: 1px;
    background: var(--bg-1); border-right: 1px solid var(--border); padding: 8px 0; }
  .navbtn { position: relative; background: transparent; border: 0; color: var(--dim);
    padding: 12px 4px 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; font-family: inherit;
    border-left: 2px solid transparent;
  }
  .navbtn-icon { font-size: 18px; line-height: 1; color: var(--fg-mute); }
  .navbtn-label { font-family: "JetBrains Mono", monospace; font-size: 8.5px; letter-spacing: .08em; color: var(--dim); }
  .navbtn-hot { position: absolute; top: 4px; right: 4px; font-family: "JetBrains Mono", monospace; font-size: 8px; color: var(--dim); }
  .navbtn:hover { color: var(--fg); background: rgba(255,255,255,.02); }
  .navbtn:hover .navbtn-icon, .navbtn:hover .navbtn-label { color: var(--fg); }
  .navbtn.active { background: rgba(74,222,128,.06); border-left-color: var(--ok); }
  .navbtn.active .navbtn-icon, .navbtn.active .navbtn-label { color: var(--ok); }
  .navfoot { padding: 8px 6px; border-top: 1px solid var(--border); text-align: center; }

  /* main */
  .main { grid-area: main; overflow: hidden; position: relative; }

  /* bottom */
  .bottombar { grid-area: bot; display: flex; align-items: center; gap: 0; padding: 0 12px;
    border-top: 1px solid var(--border); background: var(--bg-1); }
  .bb-item { display: flex; gap: 6px; align-items: baseline; padding: 0 14px; border-right: 1px solid var(--border); height: 100%; padding-top: 6px; }
  .bb-item:first-child { padding-left: 0; }

  /* panel */
  .panel { background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
    border-bottom: 1px solid var(--border); background: var(--bg-1); flex-shrink: 0; }
  .panel-title { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em; color: var(--ok); text-transform: uppercase; }
  .panel-body { padding: 10px; overflow: auto; flex: 1; min-height: 0; }

  /* screens */
  .screen { height: 100%; padding: 10px; gap: 10px; overflow: hidden; }
  .screen.empty { display: grid; place-items: center; }

  .fleet { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; gap: 10px; }
  .fleet .screen-l { display: grid; grid-template-rows: 1fr 280px; gap: 10px; min-height: 0; min-width: 0; }
  .fleet .screen-r { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 0; }
  .fleet .screen-l > .panel { min-height: 0; }

  /* fleet map */
  .floormap { position: relative; width: 100%; height: 100%; background:
    radial-gradient(ellipse at center, var(--bg-2), var(--bg)); overflow: hidden; }
  .floormap-grid { position: absolute; inset: 0; width: 100%; height: 100%; }
  .floor-hud { position: absolute; background: rgba(6,9,13,.7); border: 1px solid var(--border);
    padding: 8px 10px; backdrop-filter: blur(8px); display: flex; gap: 10px; align-items: center; }
  .floor-hud.tl { top: 10px; left: 10px; }
  .floor-hud.tr { top: 10px; right: 10px; }
  .floor-hud.bl { bottom: 10px; left: 10px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .floor-hud.br { bottom: 10px; right: 10px; flex-direction: column; align-items: flex-end; gap: 2px; }

  /* table */
  .table-wrap { overflow: auto; height: 100%; }
  .table-wrap.small { font-size: 10.5px; }
  .dtable { width: 100%; border-collapse: collapse; font-family: "JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .dtable th { text-align: left; font-weight: 500; color: var(--dim); text-transform: uppercase;
    letter-spacing: .08em; font-size: 9.5px; padding: 6px 8px; position: sticky; top: 0;
    background: var(--bg-1); border-bottom: 1px solid var(--border-2); cursor: pointer; user-select: none; }
  .dtable th:hover { color: var(--fg); }
  .dtable td { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--fg); }
  .dtable tr { cursor: pointer; }
  .dtable tr:hover { background: rgba(255,255,255,.02); }
  .dtable tr.sel { background: rgba(74,222,128,.07); }
  .dtable tr.sel td { color: var(--ok); }
  .dtable tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--ok); }
  .dtable tr.row-err { background: rgba(239,68,68,.04); }

  /* chips / buttons / inputs */
  .chip { background: transparent; color: var(--fg-mute); border: 1px solid var(--border-2);
    padding: 3px 8px; font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: .06em;
    cursor: pointer; }
  .chip:hover { color: var(--fg); border-color: var(--fg-mute); }
  .chip.on { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.06); }
  .btn { background: transparent; color: var(--fg); border: 1px solid var(--border-2);
    padding: 5px 10px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .06em;
    cursor: pointer; }
  .btn:hover { border-color: var(--fg-mute); background: rgba(255,255,255,.02); }
  .btn.primary { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.08); }
  .btn.primary:hover { background: rgba(74,222,128,.16); }
  .btn.danger { color: var(--err); border-color: var(--err); background: rgba(239,68,68,.08); }
  .btn.danger:hover { background: rgba(239,68,68,.18); }
  .inp { background: var(--bg-2); border: 1px solid var(--border); color: var(--fg);
    padding: 4px 8px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; }
  .inp:focus { outline: none; border-color: var(--ok); }

  /* alerts list */
  .alerts { display: flex; flex-direction: column; max-height: 100%; overflow: auto; }
  .alert { display: grid; grid-template-columns: 40px 70px 50px 1fr; gap: 8px; align-items: center;
    padding: 5px 10px; border-bottom: 1px solid var(--border); }
  .alert:hover { background: rgba(255,255,255,.02); }
  .sev { font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 1px 4px; letter-spacing: .08em;
    border: 1px solid; text-align: center; min-width: 38px; display: inline-block; }
  .sev-OK    { color: var(--ok);     border-color: var(--ok);     background: rgba(74,222,128,.08); }
  .sev-INFO  { color: var(--info);   border-color: var(--info);   background: rgba(56,189,248,.08); }
  .sev-WARN  { color: var(--warn);   border-color: var(--warn);   background: rgba(251,191,36,.08); }
  .sev-ERR   { color: var(--err);    border-color: var(--err);    background: rgba(239,68,68,.08); }
  .sev-DEBUG { color: var(--fg-mute);border-color: var(--border-2);background: transparent; }

  /* robot detail grid */
  .robot { padding: 10px; }
  .robot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 280px 280px auto; gap: 10px; height: calc(100vh - 84px - 32px); overflow: auto; }
  .robot-grid > .panel { min-height: 0; }

  /* camera */
  .camera { position: relative; background: #02060a; border: 1px solid var(--border); overflow: hidden; width: 100%; height: 100%; }
  .cam-hud-tl, .cam-hud-tr, .cam-hud-bl, .cam-hud-br { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 10px; padding: 4px 8px; }
  .cam-hud-tl { top: 0; left: 0; }
  .cam-hud-tr { top: 0; right: 0; }
  .cam-hud-bl { bottom: 0; left: 0; }
  .cam-hud-br { bottom: 0; right: 0; }

  /* teleop */
  .teleop { display: grid; grid-template-rows: 380px 1fr; gap: 10px; }
  .teleop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; min-height: 0; }
  .teleop-grid > .panel { min-height: 0; overflow: auto; }
  .joystick { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .key { width: 30px; height: 30px; border: 1px solid var(--border-2); display: grid; place-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--fg-mute); background: var(--bg-2); }
  .key.on { color: var(--ok); border-color: var(--ok); background: rgba(74,222,128,.12); box-shadow: 0 0 8px rgba(74,222,128,.25); }
  .key.ghost { border-color: transparent; background: transparent; }

  /* tasks */
  .tasks { padding: 10px; }
  .tasks-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr 200px 280px; gap: 10px; height: calc(100vh - 84px - 32px); }
  .tasks-grid > .panel { min-height: 0; }

  /* gantt */
  .gantt { position: relative; padding: 10px; }
  .gantt-axis { display: grid; grid-template-columns: 110px 1fr; }
  .gantt-axis::before { content: ""; }
  .gantt-axis { display: flex; padding-left: 110px; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
  .gantt-tick { flex: 1; border-left: 1px dashed var(--border); padding-left: 4px; }
  .gantt-row { display: flex; height: 22px; align-items: center; margin-bottom: 4px; }
  .gantt-label { width: 110px; font-size: 10px; color: var(--fg-mute); }
  .gantt-track { flex: 1; height: 100%; background: var(--track); position: relative; }
  .gantt-bar { position: absolute; top: 2px; bottom: 2px; min-width: 30px; display: flex; align-items: center; color: #06090d; font-weight: 600; }
  .gantt-now { position: absolute; top: 24px; bottom: 10px; width: 2px; background: var(--err); margin-left: 110px; }
  .gantt-now span { position: absolute; top: -16px; left: -14px; }

  /* mission composer */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .form-row .inp { width: 100%; }

  /* avail row */
  .avail-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .avail-row:hover { background: rgba(255,255,255,.02); }

  /* scene */
  .scene { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 240px; gap: 10px; height: calc(100vh - 84px - 32px); padding: 10px; }
  .scene-canvas { position: relative; width: 100%; height: 100%; background: #02060a; overflow: hidden; min-height: 400px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  .row input { accent-color: var(--ok); }
  .det { display: grid; grid-template-columns: 12px 70px 50px 1fr; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .det .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* analytics */
  .analytics { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; padding: 10px; overflow: auto; height: calc(100vh - 84px - 32px); }
  .kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 10px; }
  .hbars { display: flex; flex-direction: column; gap: 5px; }
  .hbar-row { display: flex; align-items: center; gap: 8px; }
  .heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .heat-cell { aspect-ratio: 2/1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 6px; border: 1px solid var(--border); min-height: 40px; }

  /* logs */
  .logs { display: grid; grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px; height: calc(100vh - 84px - 32px); }
  .logs > .panel { min-height: 0; }
  .logs > .panel:first-child { grid-row: 1 / span 2; }
  .logstream { font-family: "JetBrains Mono", monospace; padding: 4px 0; overflow: auto; height: 100%; }
  .logline { display: flex; gap: 10px; padding: 2px 10px; border-bottom: 1px solid rgba(140,180,200,.05); align-items: center; }
  .logline:hover { background: rgba(74,222,128,.04); }
  .topic-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .diag-tree { font-family: "JetBrains Mono", monospace; }
  .diag-row { display: flex; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--border); }

  /* settings */
  .settings { padding: 10px; height: calc(100vh - 84px - 32px); overflow: auto; }
  .settings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .settings-grid > .panel { min-height: 0; }
  .pid-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .audit-row { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .switch { width: 28px; height: 14px; background: var(--track); border: 1px solid var(--border-2); position: relative; cursor: pointer; }
  .switch-thumb { position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; background: var(--fg-mute); transition: .15s; }
  .switch.on { background: rgba(74,222,128,.2); border-color: var(--ok); }
  .switch.on .switch-thumb { left: 15px; background: var(--ok); }

  /* density */
  .app[data-density="dense"] .dtable td { padding: 3px 8px; }
  .app[data-density="dense"] .panel-body { padding: 8px; }
  .app[data-density="comfy"] .panel-body { padding: 14px; }
  .app[data-density="comfy"] .dtable td { padding: 6px 10px; }

  /* anims */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50% { box-shadow: 0 0 0 4px transparent; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(140,180,200,.15); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(140,180,200,.3); }

  /* film grain + scanlines for mission-control feel */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
    background:
      repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 2px,
        rgba(255,255,255,.012) 2px,
        rgba(255,255,255,.012) 3px
      );
    mix-blend-mode: overlay;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screen-fleet.jsx"></script>
<script type="text/babel" src="screen-robot.jsx"></script>
<script type="text/babel" src="screen-teleop.jsx"></script>
<script type="text/babel" src="screen-aux.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
