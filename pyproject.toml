[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-robotarm"
version = "0.3.0"
description = "Virtual robot station with CAM toolpaths and multi-vendor program export (RAPID/KRL/URScript)"
requires-python = ">=3.12"
authors = [{name = "POC-RobotArm contributors"}]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core install is intentionally light — just enough to run the catalog
# tests, import the simulator, and use the motion IR + post-processors
# (which are stdlib-only). Heavy dependencies live in extras.
dependencies = [
    "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
sim = ["pybullet>=3.2.5"]
rtb = [
    "roboticstoolbox-python>=1.1.0",
    "scipy>=1.10.0",
    "spatialmath-python>=1.1.0",
    "matplotlib>=3.7.0",
]
llm = ["ollama>=0.4.0"]
gui = ["Pillow>=10.0"]
station = [
    "trimesh>=4.0",
    "ezdxf>=1.0",
]
ui = [
    "PySide6>=6.5",
    "trimesh>=4.0",
    "ezdxf>=1.0",
]
cam = [
    "trimesh>=4.0",
    "ezdxf>=1.0",
]
vision = [
    "opencv-contrib-python>=4.10",
    "numpy>=1.24,<2.0",
    "Pillow>=10.0",
]
vision-ml = ["ultralytics>=8.3"]
planning = []
learning = []
io = []
server = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]
all = [
    "ezdxf>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "matplotlib>=3.7.0",
    "ollama>=0.4.0",
    "opencv-contrib-python>=4.10",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "pybullet>=3.2.5",
    "PySide6>=6.5",
    "roboticstoolbox-python>=1.1.0",
    "scipy>=1.10.0",
    "spatialmath-python>=1.1.0",
    "trimesh>=4.0",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.scripts]
robotarm = "src.main:main"
robotarm-sim = "src.simulation.gui:main"
robotarm-station = "src.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "server*"]

[tool.setuptools.package-data]
"*" = ["*.urdf", "*.md", "assets/**/*"]

[tool.pytest.ini_options]
markers = [
    "gui: tests that require a real GUI (skipped unless RUN_GUI_TESTS=1)",
    "vision: tests that require opencv-contrib-python",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
